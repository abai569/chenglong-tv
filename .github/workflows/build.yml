name: Build APKs

on:
  push:
    branches: [fongmi]
    # update.json 由本 workflow 在发版后自动提交，必须忽略，否则每次发版都会
    # 因为它自己的提交再触发一轮无用构建。
    paths-ignore:
      - 'update.json'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.10 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python for Chaquopy
        run: |
          which python3.10 || true
          python3.10 --version

      - name: Fetch FongMi Media3 fork (Gradle included build)
        run: |
          set -e
          # This app consumes androidx.media3:* from FongMi's fork. The libass /
          # secondary-text revisions of the fork are not published publicly, so the
          # branch pinned here is the one matching this app revision.
          git clone --depth 1 --branch release-1.11.0-fongmi \
            https://github.com/FongMi/media.git third_party/media3
          echo "sdk.dir=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" > third_party/media3/local.properties
          cat third_party/media3/local.properties
          ls third_party/media3

      - name: Prepare signing config
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "✅ 使用正式签名（RELEASE_KEYSTORE secret 已配置）"
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > app/release.keystore
            ALIAS="$KEY_ALIAS"
            SP="$KS_PASS"
            KP="$KEY_PASS"
          else
            echo "::warning::未配置 RELEASE_KEYSTORE，使用临时签名，发布产物将无法覆盖更新！"
            keytool -genkeypair \
              -keystore app/release.keystore \
              -alias chenglong \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass "temp123456" \
              -keypass "temp123456" \
              -dname "CN=ChengLong TV, OU=Dev, O=ChengLong, L=Beijing, ST=Beijing, C=CN"
            ALIAS=chenglong
            SP=temp123456
            KP=temp123456
          fi
          {
            echo "storeFile=release.keystore"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
          } > local.properties
          echo "--- local.properties ---"
          sed 's/Password=.*/Password=***/' local.properties
          keytool -list -keystore app/release.keystore -storepass "$SP" | head -20

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew -I .github/force-annotations.init.gradle \
            assembleLeanbackRelease assembleMobileRelease --no-daemon

      - name: Collect APKs
        run: |
          set -e
          mkdir -p release-apks
          # 版本号取自 tag（v1.0.4 -> 1.0.4），非 tag 构建则回退到 gradle 版本号。
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then
            VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          # 只发布两个组合：手机 64 位、电视 32 位。
          cp "app/build/outputs/apk/mobile/release/mobile-arm64_v8a.apk" \
             "release-apks/chenglong_${VER}_arm64_v8a.apk"
          cp "app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk" \
             "release-apks/chenglong_${VER}_armeabi_v7a.apk"
          ls -lh release-apks/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chenglong-apks
          path: release-apks/*.apk

      - name: Read built-in line sources from Config.java
        run: |
          set -e
          CFG="app/src/main/java/com/fongmi/android/tv/bean/Config.java"
          PRIMARY=$(grep -oP 'DEFAULT_VOD_URL\s*=\s*"\K[^"]+' "$CFG")
          BACKUP=$(grep -oP 'DEFAULT_VOD_BACKUP_URL\s*=\s*"\K[^"]+' "$CFG")
          echo "PRIMARY_LINE=$PRIMARY" >> "$GITHUB_ENV"
          echo "BACKUP_LINE=$BACKUP"   >> "$GITHUB_ENV"
          echo "主线路: $PRIMARY"
          echo "备用线路: $BACKUP"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 橙龙影视 ${{ github.ref_name }}
          body: |
            ## 橙龙影视 ${{ github.ref_name }}

            ### 内置线路
            - 主线路：橙龙线路 —— `${{ env.PRIMARY_LINE }}`
            - 备用线路 —— `${{ env.BACKUP_LINE }}`

            ### APK 说明
            | 文件 | 适用设备 |
            | --- | --- |
            | `chenglong_${{ env.VERSION }}_arm64_v8a.apk` | 手机（64 位 ARM） |
            | `chenglong_${{ env.VERSION }}_armeabi_v7a.apk` | 电视 / 盒子（32 位 ARM） |

            > 文件名中的版本号取自 tag 去掉 `v` 前缀（tag `v1.0.4` → `chenglong_1.0.4_arm64_v8a.apk`）。

            > `arm64_v8a` / `armeabi_v7a` 是 CPU 架构，不是端。当前只发布"手机 64 位"和"电视 32 位"两个组合；
            > 若你的电视盒子是 64 位、或手机是 32 位，反馈后可按需补出对应包。

            ### 签名信息
            - 使用正式签名，可覆盖安装更新

            ### 版本
            - 应用版本：`${{ github.ref_name }}`（设置页「版本」显示同一号）
            - 内核基于上游 FongMi/TV `fe6a5b235`（5.6.1 基线）
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 必须在 Create Release 之后：manifest 指向的附件要已存在
      - name: Publish update.json (in-app updater manifest)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          cat > /tmp/update.json <<EOF
          {
            "name": "${VER}",
            "code": ${CODE},
            "desc": "橙龙影视 ${VER}",
            "arm64_v8a": "${BASE}/chenglong_${VER}_arm64_v8a.apk",
            "armeabi_v7a": "${BASE}/chenglong_${VER}_armeabi_v7a.apk"
          }
          EOF
          cat /tmp/update.json
          # 切到 fongmi 分支（App 内 Github.raw("fongmi", "update.json") 读取的位置）
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fongmi
          git checkout fongmi
          git reset --hard origin/fongmi
          cp /tmp/update.json update.json
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化，跳过提交"
          else
            git commit -m "chore: update manifest for ${GITHUB_REF_NAME}"
            git push origin fongmi
          fi
