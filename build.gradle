buildscript {
    configurations.configureEach {
        resolutionStrategy {
            // FongMi's Media3 build-logic needs org.jetbrains:annotations 23.x, but
            // Gradle's embedded Kotlin pins it with a strict 13.0 constraint, which
            // makes the included build's classpath unresolvable. Relax the pin.
            force 'org.jetbrains:annotations:23.0.0'
        }
    }
}

plugins {
    alias libs.plugins.android.application apply false
    alias libs.plugins.android.library apply false
    alias libs.plugins.chaquo.python apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
